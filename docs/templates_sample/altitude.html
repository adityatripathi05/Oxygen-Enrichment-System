{% extends 'adminheader.html' %}
{% block title %}Altitude{% endblock %}
{% block body %}

<section id="content-wrapper">
   <div class="container-fluid">
      <div class="row">
         {% include 'partials/flash_messages.html' %}
      </div>
      <div class="row">
         <div class="col-lg-12">
            <div class="title-header">
               <h2>Altitude</h2>
            </div>
            <hr>
            <div class="edit-area p-3">
               <form action="{{ url_for('initial_setup.altitude_data')}}" method="post">
                  <div class="row">
                     <div class="col-lg-6 col-md-6 col-12">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <label for="altitudeInput">Altitude </label>
                        <input type="text" name="altitude" id="altitudeInput" class="form-control" placeholder="Altitude">
                     </div>
                     <div class="col-lg-6 col-md-6 col-12">
                        <label for="minThresholdInput">Min Threshold </label>
                        <input type="text" name="minthreshold" id="minThresholdInput" class="form-control" placeholder="Min Threshold">
                     </div>
                  </div>
                  <div class="row">
                     <div class="col-lg-12">
                        <button class="btn btn-success w-auto mt-3" type="submit">Submit</button>
                     </div>
                  </div>

               </form>
            </div>
         </div>
      </div>
   </div>
</section>
<div class="overlapbg"></div>
</div>


<script>
   //Show Stored Altitude_Data in input_box
   document.addEventListener("DOMContentLoaded", function () {
      // AJAX request to fetch altitude data
      fetch("{{ url_for('initial_setup.get_altitude') }}")
         .then(response => response.json())
         .then(data => {
            if (data.altitude) {
               // Set altitude value in the input box
               document.getElementById('altitudeInput').value = data.altitude;
               document.getElementById('minThresholdInput').value = data.minthreshold;
            }
         })
         .catch(error => {
            console.error("Error fetching altitude data:", error);
         });
   });
</script>

{% endblock body %}
