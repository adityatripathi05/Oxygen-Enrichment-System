    <script>
        $(document).ready(function () {
            $(".submenu-toggle").click(function (event) {
                event.preventDefault(); // Prevent default link behavior

                var parentLi = $(this).parent(); // Get parent <li>
                var submenu = parentLi.find(".submenu"); // Get submenu inside this <li>

                if (!parentLi.hasClass("active")) {
                    // Close all other submenus before opening a new one
                    $(".submenu").slideUp(300);
                    $(".has-submenu").removeClass("active");

                    // Open the clicked submenu
                    parentLi.addClass("active");
                    submenu.stop(true, true).slideDown(300);
                } else {
                    // Close the current submenu if it's already open
                    submenu.stop(true, true).slideUp(300, function () {
                        parentLi.removeClass("active");
                    });
                }
            });

            // Ensure all submenus are hidden on page load
            $(".submenu").hide();
        });


        $(document).ready(function () {
            $(".menu-icon").click(function () {
                $(this).toggleClass("active");
                $(this).toggleClass("fa-bars fa-times");
            });
        });

        // Light Theme JS
        function updateTheme() {
            const isLight = localStorage.getItem("theme") === "white";

            if (isLight) {
                $("body").addClass("white-bg");
                $("#toggleIconn").attr("src", "/static/icons/moon.png"); // Light theme = moon icon
                $("#toggleIconn").attr("title", "Switch to dark theme");
                //$("#themeText").text("Move to Dark Theme");
            } else {
                $("body").removeClass("white-bg");
                $("#toggleIconn").attr("src", "/static/icons/sun.png"); // Dark theme = sun icon
                $("#toggleIconn").attr("title", "Switch to light theme");
                //$("#themeText").text("Move to Light Theme");
            }
        }

        // Page load hone par theme set karna
        updateTheme();

        // Toggle on click
        $("#toggleIconn").click(function () {
            $("body").toggleClass("white-bg");

            if ($("body").hasClass("white-bg")) {
                localStorage.setItem("theme", "white");
            } else {
                localStorage.removeItem("theme");
            }

            // Reload to apply theme change and icon properly
            setTimeout(function () {
                location.reload();
            }, 200); // 0.3 second delay
        });

    </script>
