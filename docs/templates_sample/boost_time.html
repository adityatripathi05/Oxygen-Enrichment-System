{% extends 'adminheader.html' %}
{% block title %}Boost Time{% endblock %}
{% block body %}

<section id="content-wrapper">
   <div class="container-fluid">
      <div class="row">
         <div class="col-lg-12">
            <div class="title-header">
               <h2>Set Boost Time Duration</h2>
            </div>
            <hr>
            <div class="edit-area p-3">
               <form action="{{ url_for('initial_setup.add_boost_time')}}" method="POST">
                  {{ form.hidden_tag() }}
                  <div class="row">
                     <div class="col-lg-12 col-md-12 col-12">
                        {{ form.boosttime.label(for="boostTime", class="form-label")}} 
                     </div>
                     <div class="col-lg-3 col-md-3 col-12 mt-3">
                        {{ form.boosttime(id="boostTime", class="form-select")}}
                     </div>
                     <div class="col-lg-2 col-md-2 col-12 mt-3">
                        <button class="btn btn-success w-auto" type="submit">Submit</button>
                     </div>
                     <!-- <div class="d-grid gap-2 col-6 mx-auto mt-4">
                        <button class="btn btn-success w-auto" type="submit">Submit</button>
                     </div> -->
                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</section>
<div class="overlapbg"></div>
</div>

<script>
   //Show Stored Altitude_Data in input_box
   document.addEventListener("DOMContentLoaded", function () {
      // AJAX request to fetch altitude data
      fetch("{{ url_for('initial_setup.get_boost') }}")
         .then(response => response.json())
         .then(data => {
            if (data.boosttime) {
               // Set altitude value in the input box
               document.getElementById('boostTime').value = data.boosttime;
               
            }
         })
         .catch(error => {
            console.error("Error fetching boost time data:", error);
         });
   });
</script>
{% endblock body %}
