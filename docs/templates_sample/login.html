{% extends 'header.html' %}
{% block title %}Login Page{% endblock %}
{% block body %}

<div class="wrapper">
  <div class="title-text">
    <div class="title login">Technician Login</div>
    <div class="title signup">Zone Login</div>
  </div>
  <div class="form-container">
    <div class="slide-controls">
      <input type="radio" name="slide" id="login" checked>
      <input type="radio" name="slide" id="signup">
      <label for="login" class="slide login">Technician</label>
      <label for="signup" class="slide signup">Zones</label>
      <div class="slider-tab"></div>
    </div>
    <div class="form-inner">
      <form action="{{ url_for('user_management.tech_login') }}" class="login">
        <div class="user-img">
          <div class="img-box"><img src="{{ url_for('static', filename='img/administrator.png') }}"></div>
          <p>Access Technician Panel</p>
        </div>
        <div class="field btn p-0">
          <div class="btn-layer"></div>
          <input type="submit" value="Click Me">
        </div>
      </form>

      <form action="{{ url_for('main.guest_login') }}" class="signup">
        <div class="user-img">
          <div class="img-box"><img src="{{ url_for('static', filename='img/user.png') }}"></div>
          <p>Access Zone Panel</p>
        </div>
        <div class="field btn p-0">
          <div class="btn-layer"></div>
          <input type="submit" value="Click Me">
        </div>
      </form>
      
    </div>
  </div>
</div>

{% endblock body %}
